[platformio]
src_dir = .
include_dir = src
test_dir = test

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Build flags
; To disable laser safety interlock, add: -DDISABLE_LASER_INTERLOCK
; WARNING: Only use for systems without lasers. Removes safety protection.
build_flags =
    -D ARDUINO_TEENSY41
    -I src
    ; The USB serial port carries the BINARY host protocol (24-byte status packets every 10 ms).
    ; FastLED >= 3.10 logs through FL_DBG / FL_WARN to that same port unless NDEBUG is set, e.g.
    ; "SpiChannelEngineAdapter: Releasing 1 completed channels" after every FastLED.show(). That
    ; text lands in the middle of the packet stream and the host loses sync (seen on a bench
    ; controller, 2026-09-20). Verbosity 0 compiles every FastLED log macro out (~15 kB smaller).
    ; No library may print on the protocol port.
    -D FASTLED_LOG_VERBOSITY=0

; Exclude test directory from firmware build
build_src_filter =
    +<*>
    -<test/>

; Library dependencies - EXACT versions, so every machine builds the same image.
; A caret range resolves to whatever is newest the first time a machine installs, then sticks with
; that cached copy; FastLED patch releases have changed the firmware a lot - controller code is
; 45,992 B on 3.10.3, 121,384 B on 3.10.5, 71,844 B on 3.10.8 - and 3.10.5 started printing its log
; on the protocol serial port (see FASTLED_LOG_VERBOSITY above). 3.10.3 is what this firmware has
; run on since it moved to PlatformIO (Dec 2025): every fresh build until 3.10.5 appeared (Jun 2026),
; and the bench builds through Sept 2026. Bump it deliberately: build, then check the LED matrix
; on a real controller (brightfield live view and an acquisition).
lib_deps =
    fastled/FastLED@3.10.3
    bakercp/PacketSerial@1.4.0

; Upload settings
upload_protocol = teensy-cli

; Monitor settings
monitor_speed = 2000000

; Native test environment (runs on host machine)
[env:native]
platform = native
build_flags =
    -I src
    -std=c++11
; Build filter for native tests:
; - Exclude everything by default (-<*>) since most firmware code has Arduino dependencies
; - Include only src/utils/*.cpp which contains pure C++ utilities (e.g., crc8.cpp)
; - Protocol constants are header-only (constants_protocol.h) so no build filter needed
; - If adding new host-testable modules, place them in src/utils/ or add explicit paths here
build_src_filter =
    -<*>
    +<src/utils/*.cpp>
